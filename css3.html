<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 - Styling hiện đại</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #4facfe; margin-bottom: 20px; }
        .back-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSS3</h1>
        <p>CSS3 là ngôn ngữ stylesheet mạnh mẽ với các tính năng:</p>
        <ul>
            <li>Flexbox và Grid Layout</li>
            <li>Animations và Transitions</li>
            <li>Border-radius và Box-shadow</li>
            <li>Gradients và Transform</li>
        </ul>
        <a href="index.html" class="back-btn">← Quay lại</a>
    </div>
</body>
</html>
