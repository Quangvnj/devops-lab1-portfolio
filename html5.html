<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 - Công nghệ hiện đại</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #ff7e5f; margin-bottom: 20px; }
        .back-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HTML5</h1>
        <p>HTML5 là phiên bản mới nhất của HTML, mang lại nhiều tính năng hiện đại như:</p>
        <ul>
            <li>Semantic elements (header, nav, section, article)</li>
            <li>Canvas và SVG cho graphics</li>
            <li>Audio và Video elements</li>
            <li>Web Storage và Geolocation</li>
        </ul>
        <a href="index.html" class="back-btn">← Quay lại</a>
    </div>
</body>
</html>
